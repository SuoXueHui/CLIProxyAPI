server {
    listen 8317;
    server_name _;
    server_tokens off;

    location = /cpa-router-health {
        access_log off;
        default_type text/plain;
        return 200 "cpa-router ok\n";
    }

    # Keep usage collection and management mutations on blue until its request
    # tail and durable outbox have drained. This upstream moves to green only
    # after green is active and blue has stopped producing usage.
    location ^~ /v0/management {
        proxy_pass http://cpa_management_backend;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location ^~ /v0/resource/plugins/ {
        proxy_pass http://cpa_management_backend;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location = /management.html {
        proxy_pass http://cpa_management_backend;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location / {
        proxy_pass http://cpa_proxy_backend;
        include /etc/nginx/conf.d/proxy-params.inc;
    }
}
