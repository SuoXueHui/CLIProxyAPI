user nginx;
worker_processes auto;
worker_shutdown_timeout 24h;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Exclude query strings, referrers, and authenticated user fields from logs.
    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 100000;

    # An empty value removes Connection for ordinary HTTP while preserving upgrades.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}
